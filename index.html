$('out').onclick=()=>{ROLE=null;closePanel();$('login').classList.add('on');$('lmsg').textContent=''};

 ROLE='admin';$('login').classList.remove('on');setView(location.hash=='#warga'?'warga':'builder');toast('Masuk sebagai Admin (Builder)')};

<script>
// ===== Mode halaman: warga (default) atau admin (?admin / admin.html) =====
(function(){const MODE=(new URLSearchParams(location.search).has('admin')||window.APP_MODE=='admin')?'admin':'warga';if(MODE=='admin')document.title='Admin Kotaonlen';
 const $$=id=>document.getElementById(id);
 if(!window.FBMODE){const m=$$('lmsg');if(m){m.style.color='#b26a00';m.textContent='⚠️ Firebase belum diatur di config.js — berjalan dalam mode lokal (data tidak tersimpan).'}
  if(MODE=='warga'){$$('lAdmin').style.display='none'}else{$$('lWarga').style.display='none'}return}
 const box=document.querySelector('.lbox'),msg=t=>{const m=$$('lmsg');if(m)m.textContent=t};
 const err=e=>msg(e&&e.code=='auth/popup-closed-by-user'?'Login dibatalkan.':e&&e.code=='auth/unauthorized-domain'?'Domain belum diizinkan: Firebase → Authentication → Settings → Authorized domains.':e&&e.code=='auth/admin-restricted-operation'?'Aktifkan login Anonymous: Firebase → Authentication → Sign-in method → Anonymous.':'Gagal: '+((e&&e.message)||e));
 if(MODE=='admin'){
  box.innerHTML=`<h1>🛠️ Admin Kotaonlen</h1><p>Khusus admin kota. Masuk dengan akun Google yang terdaftar sebagai admin.</p><button id="fbA">🔐 Masuk Admin dengan Google<small>Email harus terdaftar di daftar admin</small></button><div id="lmsg"></div>`;
  const enter=async()=>{msg('Memuat kota…');await initData();ROLE='admin';$$('login').classList.remove('on');setView('builder');toast('Masuk sebagai Admin')};
  $$('fbA').onclick=async()=>{try{msg('Membuka login Google…');await FB.google();if(!FB.isAdm()){await FB.out();msg('⛔ Email ini bukan admin Kotaonlen.');return}enter()}catch(e){err(e)}};
  $$('out').onclick=async()=>{await FB.out();location.reload()};
  FB.ready.then(u=>{if(u&&FB.isAdm())enter()});
 }else{
  box.innerHTML=`<h1>🏙️ Kotaonlen</h1><p>Memuat kota…</p><div id="lmsg"></div>`;$$('out').style.display='none';
  (async()=>{try{let u=await FB.ready;if(!u){await FB.guest()}await initData();await Promise.race([WREADY,new Promise(r=>setTimeout(r,6000))]);ROLE='warga';$$('login').classList.remove('on');setView('warga');if(ME.ktp)toast('Selamat datang kembali, '+ME.ktp.nama+'!')}catch(e){err(e)}})();
 }
})();
</script></body></html>
